[project]
name = "huddle-ai"
version = "0.1.0"
description = "Open-weight speech-to-text and grounded extraction for Huddle alert cards"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1"]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["huddle_ai"]

[tool.pytest.ini_options]
pythonpath = ["."]
